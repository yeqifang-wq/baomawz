    const JISUAPI_KEY = 'eb02fb2bb0fecffd';

    async function fetchProductFromAPI(barcode) {
      const url = `https://api.jisuapi.com/barcode2/query?barcode=${barcode}&appkey=${JISUAPI_KEY}`;
      // 先尝试直连，若 CORS 拦截再走代理
      for (const endpoint of [url, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`]) {
        try {
          const res = await fetch(endpoint, { signal: AbortSignal.timeout(6000) });
          if (!res.ok) continue;
          const data = await res.json();
          if (data.status === 0 && data.result && data.result.name) return data.result;
        } catch (_) { /* 继续下一个端点 */ }
      }
      return null;
    }

    // 别名查找：支持 name 精确匹配 + aliases 模糊匹配
    function findAdditive(name) {
      const n = (name || '').trim();
      return ADDITIVES_DB.find(a =>
        a.name === n || (a.aliases && a.aliases.some(alias => n.includes(alias) || alias.includes(n)))
      );
    }

    function assessProduct(productAdditives, babyConditions = [], ageMonths = 24) {
      if (!productAdditives) return {
        noData: true, maxRisk: 'unknown',
        riskCounts: { high:[], medium:[], low:[], safe:[] },
        personalWarnings:[], hasPersonalWarnings: false
      };
      const riskCounts = { high: [], medium: [], low: [], safe: [] };
      const personalWarnings = [];
      const isInfant = ageMonths < 12;
      const isToddler = ageMonths >= 12 && ageMonths <= 36;

      productAdditives.forEach(additiveName => {
        const additive = findAdditive(additiveName);
        if (!additive) { riskCounts.safe.push(additiveName); return; }

        let effectiveRisk = additive.risk;
        if (additive.bannedInfantFood && (isInfant || isToddler)) {
          effectiveRisk = 'high';
          personalWarnings.push({
            additive: additiveName, risk: 'high',
            category: additive.category,
            reason: 'GB2760 婴幼儿食品禁用'
          });
        } else {
          const isPersonal = babyConditions.some(c => additive.effects && additive.effects[c]);
          if (isPersonal) {
            personalWarnings.push({ additive: additiveName, risk: additive.risk, category: additive.category });
          }
        }
        riskCounts[effectiveRisk].push(additiveName);
      });

      const seen = new Set();
      const dedupedWarnings = personalWarnings.filter(w => {
        if (seen.has(w.additive)) return false; seen.add(w.additive); return true;
      });

      const maxRisk = RISK_ORDER.find(r => riskCounts[r].length > 0) || 'safe';
      return { noData: false, maxRisk, riskCounts, personalWarnings: dedupedWarnings, hasPersonalWarnings: dedupedWarnings.length > 0 };
    }

                  <div className="flex-1 overflow-y-auto p-4">
                    <button onClick={() => setShowModal(true)}
                      className="w-full bg-gradient-to-br from-teal-500 to-teal-700 rounded-3xl p-6 flex flex-col items-center gap-3 shadow-lg mb-4 hover:shadow-xl transition">
                      <div className="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center">
                        <Camera size={36} className="text-white" />
                      </div>
                      <div className="text-white text-center">
                        <div className="font-bold text-lg">扫一扫</div>
                        <div className="text-teal-100 text-xs">查零食添加剂风险</div>
                      </div>
                    </button>

                    {/* 宝宝档案摘要 */}
                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-4">
                      <div className="text-xs font-bold text-amber-800 mb-2">⚡ {baby.name} 的个性化关注</div>
                      <div className="flex flex-wrap gap-1">
                        {baby.conditions.map(c => (
                          <span key={c} className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">
                            {CONDITIONS_MAP[c]?.icon} {CONDITIONS_MAP[c]?.label}
                          </span>
                        ))}
                        {baby.allergies.map(a => (
                          <span key={a} className="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">{a}过敏</span>
                        ))}
                      </div>
                    </div>

                    {/* 最近扫描 */}
                    <div className="text-sm font-bold text-gray-700 mb-2">最近扫描</div>
                    {history.slice(0,3).map((item,i) => {
                      const a = assessProduct(item.additives, baby.conditions, baby.ageMonths);
                      return (
                        <button key={i} onClick={() => setProduct(item)}
                          className={`w-full flex items-center gap-3 bg-white rounded-xl border-2 ${RISK_CONFIG[a.maxRisk].border} p-3 mb-2 text-left shadow-sm hover:shadow transition`}>
                          <span className="text-2xl">{item.emoji}</span>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium text-gray-800 truncate">{item.name}</div>
                            <div className="text-xs text-gray-400">{item.scanDate}</div>
                            {a.hasPersonalWarnings && <div className="text-xs text-amber-600">⚡ 个性化预警</div>}
                          </div>
                          <RiskBadge level={a.maxRisk} />
                        </button>
                      );
                    })}
                  </div>
                </div>

              ) : tab === 'search' ? (
                /* ── 搜索页 ── */
                <div className="flex flex-col h-full">
                  <div className="bg-white px-4 pt-3 pb-2 border-b border-gray-100 flex-shrink-0">
                    <div className="font-bold text-gray-800 mb-2">搜索产品</div>
                    <div className="flex items-center bg-gray-100 rounded-xl px-3 py-2 mb-2">
                      <Search size={14} className="text-gray-400 mr-2" />
                      <input className="flex-1 bg-transparent text-sm outline-none placeholder-gray-400"
                        placeholder="搜索品牌或产品名"
                        value={searchQ}
                        onChange={e => setSearchQ(e.target.value)} />
                    </div>
                    <div className="flex gap-2 overflow-x-auto pb-1">
                      {CATEGORIES.map(cat => (
                        <button key={cat} onClick={() => setSearchCat(cat)}
                          className={`flex-shrink-0 text-xs px-3 py-1.5 rounded-full font-medium transition ${
                            searchCat === cat ? 'bg-teal-600 text-white' : 'bg-gray-100 text-gray-600'
                          }`}>{cat}</button>
                      ))}
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-3">
                    <div className="grid grid-cols-2 gap-2">
                      {searchResults.map(p => {
                        const a = assessProduct(p.additives, baby.conditions, baby.ageMonths);
                        return (
                          <button key={p.id} onClick={() => setProduct(p)}
                            className={`p-3 rounded-2xl border-2 ${RISK_CONFIG[a.maxRisk].border} ${RISK_CONFIG[a.maxRisk].bg} text-left hover:shadow transition`}>
                            <div className="text-3xl mb-1">{p.emoji}</div>
                            <div className="text-xs font-bold text-gray-800 line-clamp-2">{p.name}</div>
                            <div className="text-xs text-gray-500 mt-0.5">{p.brand}</div>
                            <div className="mt-1.5"><RiskBadge level={a.maxRisk} /></div>
                            {a.hasPersonalWarnings && <div className="text-xs text-amber-600 mt-0.5">⚡个性化</div>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

              ) : tab === 'history' ? (
                /* ── 记录页 ── */
                <div className="flex flex-col h-full">
                  <div className="bg-white px-4 py-3 border-b border-gray-100 flex-shrink-0">
                    <div className="font-bold text-gray-800 mb-2">扫描记录</div>
                    <div className="flex gap-2">
                      {['全部','高风险','中风险','安全'].map(f => (
                        <button key={f} onClick={() => setHistFilter(f)}
                          className={`flex-1 text-xs py-1.5 rounded-full font-medium transition ${
                            histFilter === f ? 'bg-teal-600 text-white' : 'bg-gray-100 text-gray-600'
                          }`}>{f}</button>
                      ))}
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-3 space-y-2">
                    {histItems.length === 0
                      ? <div className="text-center text-gray-400 text-sm mt-12">暂无记录</div>
                      : histItems.map((item,i) => {
                          const a = assessProduct(item.additives, baby.conditions, baby.ageMonths);
                          return (
                            <button key={i} onClick={() => setProduct(item)}
                              className={`w-full flex items-center gap-3 bg-white rounded-2xl border-2 ${RISK_CONFIG[a.maxRisk].border} p-3 text-left shadow-sm hover:shadow transition`}>
                              <span className="text-2xl">{item.emoji}</span>
                              <div className="flex-1 min-w-0">
                                <div className="text-sm font-medium text-gray-800 truncate">{item.name}</div>
                                <div className="text-xs text-gray-400">{item.scanDate}</div>
                                {a.hasPersonalWarnings && <div className="text-xs text-amber-600">⚡ 有个性化预警</div>}
                              </div>
                              <RiskBadge level={a.maxRisk} />
                            </button>
                          );
                        })
                    }
                  </div>
                </div>

              ) : (
                /* ── 宝宝档案页 ── */
                <div className="flex flex-col h-full">
                  <div className="bg-gradient-to-br from-teal-500 to-teal-700 px-4 py-6 text-white flex-shrink-0">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-4">
                        <div className="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-3xl">👶</div>
                        <div>
                          {editBaby
                            ? <input className="text-xl font-bold bg-white/20 rounded-lg px-2 py-1 text-white w-28"
                                value={baby.name} onChange={e => setBaby({...baby, name: e.target.value})} />
                            : <div className="text-xl font-bold">{baby.name}</div>
                          }
                          <div className="text-teal-100 text-sm">{baby.ageMonths}个月 · {baby.conditions.length}项关注</div>
                        </div>
                      </div>
                      <button onClick={() => setEditBaby(!editBaby)}
                        className={`px-3 py-1.5 rounded-xl text-sm font-bold ${editBaby ? 'bg-white text-teal-700' : 'bg-white/20 text-white'}`}>
                        {editBaby ? '💾 保存' : '✏️ 编辑'}
                      </button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {/* 疾病档案 */}
                    <div className="bg-white rounded-2xl border border-gray-100 p-4">
                      <div className="text-sm font-bold text-gray-700 mb-3">🏥 疾病档案</div>
                      <div className="flex flex-wrap gap-2">
                        {Object.entries(CONDITIONS_MAP).map(([id, {label, icon}]) => {
                          const selected = baby.conditions.includes(id);
                          return (
                            <button key={id}
                              onClick={() => editBaby && setBaby({...baby, conditions: selected ? baby.conditions.filter(c=>c!==id) : [...baby.conditions, id]})}
                              className={`text-xs px-3 py-1.5 rounded-full border font-medium transition ${
                                selected ? 'bg-red-500 text-white border-red-500' : 'bg-gray-50 text-gray-600 border-gray-200'
                              } ${editBaby ? 'cursor-pointer' : 'cursor-default'}`}>
                              {icon} {label}
                            </button>
                          );
                        })}
                      </div>
                      {editBaby && <div className="text-xs text-gray-400 mt-2">点击选中/取消宝宝的疾病情况</div>}
                    </div>

                    {/* 过敏史 */}
                    <div className="bg-white rounded-2xl border border-gray-100 p-4">
                      <div className="text-sm font-bold text-gray-700 mb-3">🌸 过敏史</div>
                      <div className="flex flex-wrap gap-2">
                        {baby.allergies.map((a,i) => (
                          <span key={i} className="inline-flex items-center gap-1 text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded-full">
                            {a}过敏
                            {editBaby && <button onClick={() => setBaby({...baby, allergies: baby.allergies.filter((_,j)=>j!==i)})} className="ml-0.5">×</button>}
                          </span>
                        ))}
                        {editBaby && (
                          <div className="flex gap-1">
                            <input className="text-xs border border-gray-200 rounded-full px-2 py-1 w-20"
                              placeholder="添加…"
                              value={newAllergy}
                              onChange={e => setNewAllergy(e.target.value)}
                              onKeyDown={e => { if(e.key==='Enter'&&newAllergy.trim()){ setBaby({...baby, allergies:[...baby.allergies, newAllergy.trim()]}); setNewAllergy(''); }}} />
                            <button className="text-xs text-white bg-orange-400 rounded-full px-2 py-1"
                              onClick={() => { if(newAllergy.trim()){ setBaby({...baby, allergies:[...baby.allergies, newAllergy.trim()]}); setNewAllergy(''); }}}>+</button>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* 说明卡 */}
                    <div className="bg-teal-50 rounded-2xl p-4 border border-teal-100">
                      <div className="text-xs font-bold text-teal-700 mb-1">🧠 匹配引擎说明</div>
                      <div className="text-xs text-teal-600 leading-relaxed">
                        每次扫码后，引擎会将产品添加剂与宝宝的疾病史、过敏史进行交叉匹配，
                        自动生成个性化风险预警，并标注具体触发原因。
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* ── 底部导航 ── */}
            {!product && (
              <div className="bg-white border-t border-gray-100 flex flex-shrink-0 pb-1">
                {[
                  { key:'scan',    label:'扫一扫', Icon:Camera },
                  { key:'search',  label:'搜索',   Icon:Search },
                  { key:'history', label:'记录',   Icon:History },
                  { key:'baby',    label:'宝宝',   Icon:Baby },
                ].map(({key, label, Icon}) => (
                  <button key={key} onClick={() => setTab(key)}
                    className={`flex-1 flex flex-col items-center py-2 gap-0.5 transition ${
                      tab === key ? 'text-teal-600' : 'text-gray-400 hover:text-gray-600'
                    }`}>
                    <Icon size={22} />
                    <span className="text-xs">{label}</span>
                    {tab === key && <div className="w-5 h-0.5 bg-teal-600 rounded-full" />}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* ── 扫码弹层 ── */}
          {showModal && (
            <div className="fixed inset-0 bg-black/60 flex items-end justify-center z-50">
              <div className="w-[390px] bg-white rounded-t-3xl p-4 pb-8 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <div className="font-bold text-gray-800 text-lg">选择产品</div>
                  <button onClick={() => { setShowModal(false); setBarcodeInput(''); setBarcodeErr(''); }}
                    className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100">
                    <X size={16} />
                  </button>
                </div>

                {/* 条码输入 */}
                <div className="mb-4">
                  <label className="text-sm font-medium text-gray-600 mb-1 block">输入条码查询</label>
                  <div className="flex gap-2">
                    <input className="flex-1 border-2 border-gray-200 rounded-xl px-3 py-2 text-sm focus:border-teal-500 outline-none"
                      placeholder="如：6902083001018"
                      value={barcodeInput}
                      onChange={e => { setBarcodeInput(e.target.value); setBarcodeErr(''); }}
                      onKeyDown={e => e.key==='Enter' && lookupBarcode()} />
                    <button onClick={lookupBarcode} disabled={apiLoading}
                      className={`px-4 py-2 text-white rounded-xl text-sm font-bold transition ${apiLoading ? 'bg-gray-400 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-700'}`}>
                      {apiLoading ? '查询中…' : '查询'}
                    </button>
                  </div>
                  {barcodeErr && <p className="text-red-500 text-xs mt-1">{barcodeErr}</p>}
                </div>

                {/* 品类筛选 */}
                <div className="mb-3">
                  <label className="text-sm font-medium text-gray-600 mb-2 block">或按品类选择</label>
                  <div className="flex gap-2 overflow-x-auto pb-1">
                    {CATEGORIES.map(c => (
                      <button key={c} onClick={() => setScanCat(c)}
                        className={`flex-shrink-0 text-xs px-3 py-1.5 rounded-full font-medium transition ${
                          scanCat === c ? 'bg-teal-600 text-white' : 'bg-gray-100 text-gray-600'
                        }`}>{c}</button>
                    ))}
                  </div>
                </div>

                {/* 产品列表 */}
                <div className="space-y-2">
                  {searchProducts('', scanCat, 80).map(p => {
                    const a = assessProduct(p.additives, baby.conditions, baby.ageMonths);
                    return (
                      <button key={p.id} onClick={() => selectProduct(p)}
                        className="w-full flex items-center gap-3 p-3 rounded-xl border border-gray-100 hover:bg-gray-50 text-left transition">
                        <span className="text-2xl">{p.emoji}</span>
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium text-gray-800">{p.name}</div>
                          <div className="text-xs text-gray-400">{p.brand} · {p.additives.length}种添加剂</div>
                          {a.hasPersonalWarnings && <div className="text-xs text-amber-600">⚡ 有个性化预警</div>}
                        </div>
                        <RiskBadge level={a.maxRisk} />
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
